#cloud-config
# Cloud-Init Configuration for Claude Code Installation on Oracle VM
#
# This cloud-init script can be used when provisioning Oracle Compute Instances
# to automatically install Claude Code CLI.
#
# Usage in Oracle Cloud Console:
#   1. When creating a new instance, expand "Show Advanced Options"
#   2. Paste this file into "User data" field (remove these comment lines)
#   3. Select "Paste cloud-init script"
#
# Alternatively, save as file and use:
#   oci compute instance launch --user-data-file cloud-init-claude-code.yaml ...

# Update system packages
package_update: true
package_upgrade: true

# Install required system packages
packages:
  - curl
  - wget
  - git
  - build-essential
  - python3-dev

# Add PPAs and additional repositories if needed
apt:
  sources:
    nodejs:
      source: "ppa:chris-lea/node.js"

# Runcmd executes commands in order during boot
runcmd:
  # Update package list again after adding PPAs
  - apt-get update

  # Install Node.js and npm
  - apt-get install -y nodejs npm

  # Verify Node.js and npm installation
  - node --version
  - npm --version

  # Install Claude Code globally
  - npm install -g @anthropic-ai/claude-code

  # Verify Claude Code installation
  - which claude || echo "Claude Code installation failed"
  - claude --version || echo "Claude Code verification failed"

  # Update npm to latest version
  - npm install -g npm@latest

  # Create a log file for installation tracking
  - echo "Claude Code installation completed at $(date)" > /var/log/claude-code-install.log
  - echo "Node.js version: $(node --version)" >> /var/log/claude-code-install.log
  - echo "npm version: $(npm --version)" >> /var/log/claude-code-install.log
  - echo "Claude Code version: $(claude --version || echo 'N/A')" >> /var/log/claude-code-install.log

# Write files during cloud-init
write_files:
  - path: /opt/claude-code/setup.sh
    permissions: '0755'
    owner: root:root
    content: |
      #!/bin/bash
      # Post-installation setup script for Claude Code

      echo "Claude Code Installation Summary"
      echo "=================================="
      echo ""
      echo "System Information:"
      uname -a
      echo ""
      echo "Node.js:"
      node --version
      echo ""
      echo "npm:"
      npm --version
      echo ""
      echo "Claude Code:"
      claude --version
      echo ""
      echo "Installation Log:"
      cat /var/log/claude-code-install.log

# Output module to capture scripts to stdout/log
output:
  all: "| tee -a /var/log/cloud-init-output.log"

# Specify the final message when cloud-init is done
final_message: "Cloud-init has completed configuration. System ready for Claude Code development."

# Run these commands at boot completion (user-level)
bootcmd: []

# Phone home - notify a URL when finished (optional, comment out if not needed)
# power_state:
#   delay: "+30"
#   mode: reboot
#   message: "Claude Code installation complete. System rebooting."

---
# Additional script for post-installation verification
# This runs as part of the cloud-init process
#/bin/bash

set -e

echo "=== Claude Code Installation Verification ==="

# Wait for Node.js to be fully installed
sleep 10

# Check Node.js
if ! command -v node &> /dev/null; then
    echo "ERROR: Node.js not found"
    exit 1
fi
echo "✓ Node.js: $(node --version)"

# Check npm
if ! command -v npm &> /dev/null; then
    echo "ERROR: npm not found"
    exit 1
fi
echo "✓ npm: $(npm --version)"

# Check Claude Code
if ! command -v claude &> /dev/null; then
    echo "WARNING: Claude Code not in PATH yet (may be available after login)"
else
    echo "✓ Claude Code: $(claude --version)"
fi

echo "=== Installation Complete ==="
